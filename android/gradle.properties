org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
# Reuse task outputs across builds (and across CI runs via the Gradle cache).
org.gradle.caching=true
org.gradle.parallel=true
# The Flutter Gradle plugin injects defaultConfig ndk.abiFilters (all ABIs)
# unless this is set; together with the project's splits.abi.include that
# injection trips AGP 9's "Conflicting configuration" check. With filtering
# disabled, splits.abi.include below is the single source of ABI truth.
disable-abi-filtering=true
# Flutter also stamps split APKs with abiIndex*1000 + versionCode (arm64
# adds 2000), which turned our CI run number 15 into versionCode 2015.
# Exactly one ABI ships, so keep versionCode == GITHUB_RUN_NUMBER exactly.
force-version-code-ignoring-abi=true
