name: Android Alpha Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-37" "ndk;30.0.16248370"
          # Prefer the pinned CMake; fall back to the newest available 4.x.
          if ! "$SDKM" --install "cmake;4.1.2" > /dev/null 2>&1; then
            NEWEST="$("$SDKM" --list 2>/dev/null | grep -oE 'cmake;4\.[0-9]+\.[0-9]+' | sort -uV | tail -1 | cut -d';' -f2 || true)"
            if [ -n "$NEWEST" ]; then
              echo "Pinned cmake;4.1.2 unavailable, using $NEWEST"
              echo "TOADPLAYER_CMAKE_VERSION=$NEWEST" >> "$GITHUB_ENV"
              "$SDKM" --install "cmake;$NEWEST"
            else
              echo "::error::No cmake 4.x available from sdkmanager"
              exit 1
            fi
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev ninja-build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION="alpha-$(git rev-parse --short=8 HEAD)" ;;
          esac
          mkdir -p dist
          for f in build/app/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            case "$base" in
              *universal*)  cp "$f" "dist/toadplayer-${VERSION}-universal.apk" ;;
              *arm64*)      cp "$f" "dist/toadplayer-${VERSION}-arm64-v8a.apk" ;;
              *armeabi*)    cp "$f" "dist/toadplayer-${VERSION}-armeabi-v7a.apk" ;;
              *)            cp "$f" "dist/toadplayer-${VERSION}-${base}" ;;
            esac
          done
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toadplayer-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish alpha release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Toadplayer **alpha** build for testing.

            - `toadplayer-*-universal.apk` — recommended for most devices (all ABIs)
            - `toadplayer-*-arm64-v8a.apk` — modern 64-bit devices
            - `toadplayer-*-armeabi-v7a.apk` — older 32-bit devices

            Sideloading: download the APK, allow "Install unknown apps" for your
            browser/file manager, then install. This alpha is debug-signed, so
            updating over a differently-signed build requires uninstalling first.
