name: Code quality

# Static analysis kept separate from the APK build so pushes fail fast on
# analyzer findings without waiting for a native toolchain build.
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
